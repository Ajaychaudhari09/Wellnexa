services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wellnexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wellnexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellnexa_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-wellnexa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellnexa} -d ${POSTGRES_DB:-wellnexa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellnexa_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wellnexa}:${POSTGRES_PASSWORD:-wellnexa_secure_password}@postgres:5432/${POSTGRES_DB:-wellnexa_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-wellnexa}:${POSTGRES_PASSWORD:-wellnexa_secure_password}@postgres:5432/${POSTGRES_DB:-wellnexa_db}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_very_secure_random_secret_key_in_production_min_32_chars}
      - UPLOAD_DIR=/app/storage/uploads
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@wellnexa.ai}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellnexa_worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-wellnexa}:${POSTGRES_PASSWORD:-wellnexa_secure_password}@postgres:5432/${POSTGRES_DB:-wellnexa_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-wellnexa}:${POSTGRES_PASSWORD:-wellnexa_secure_password}@postgres:5432/${POSTGRES_DB:-wellnexa_db}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@wellnexa.ai}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wellnexa_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
